[project]
name = "modis-subset"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.11"
dependencies = [
    "earthaccess>=0.17.0",
    "h5netcdf>=1.8.1",
    "h5py>=3.16.0",
    "icechunk>=1.1.21",
    "kerchunk>=0.2.10",
    "netcdf4>=1.7.4",
    "numpy>=2.4.6",
    "obstore>=0.11.1",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "pyhdf>=0.11.7",
    "pyproj>=3.7.2",
    "s2sphere>=0.2.5",
    "scipy>=1.17.1",
    "sgp4>=2.27",
    "virtualizarr[hdf,kerchunk]>=2.5.1",
    "xarray>=2026.7.0",
    "zarr>=3.1.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["modis_subset"]

[dependency-groups]
dev = [
    "tabulate>=0.10.0",
]
